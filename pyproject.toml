[project]
name = "claudetrade"
version = "0.1.0"
description = "Quant research and trading system for diversified equity portfolios"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6",
    "yfinance>=0.2.40",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudetrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit external data sources (deselect with -m 'not network')"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD"]
